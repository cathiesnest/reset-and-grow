<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reset & Grow — Your Money, Your Next Move</title>

<meta name="description" content="Reset & Grow is a gentle financial organization toolbox to help you see your money clearly and find your next move.">

<meta name="theme-color" content="#C8D0C0">

<!-- Google Font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --sage: #C8D0C0;
  --charcoal: #1C1C1C;
  --line: #555555;
  --offwhite: #F2EFE9;
  --green: #2E9E5B;
  --gold: #D4A94A;
  --white: #ffffff;
  --soft: #e9ede5;
  --muted: #62675f;
  --danger: #9a4b43;
  --shadow: 0 12px 35px rgba(28,28,28,.08);
  --radius: 22px;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
  scroll-padding-top: 105px;
}

body {
  margin: 0;
  background: var(--sage);
  color: var(--charcoal);
  font-family: Inter, Arial, sans-serif;
  line-height: 1.6;
}

button,
input,
select,
textarea {
  font: inherit;
}

button {
  cursor: pointer;
}

button:focus-visible,
a:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible {
  outline: 3px solid rgba(46,158,91,.35);
  outline-offset: 2px;
}

a {
  color: inherit;
}

.container {
  width: min(1180px, calc(100% - 32px));
  margin: auto;
}

/* ---------- COVER ---------- */

.cover {
  min-height: 100vh;
  padding: 22px 0 28px;
  display: flex;
  flex-direction: column;
}

.rule {
  height: 1px;
  background: var(--line);
  width: 100%;
}

.cover-inner {
  flex: 1;
  display: grid;
  grid-template-columns: 42% 58%;
  align-items: center;
  gap: 30px;
  padding: 50px 4% 35px;
}

.cover-visual {
  display: flex;
  justify-content: center;
  align-items: center;
}

.oval {
  width: min(390px, 85%);
  aspect-ratio: .68;
  border-radius: 50%;
  background: var(--offwhite);
  position: relative;
  overflow: hidden;
  box-shadow: var(--shadow);
}

.oval-content {
  position: absolute;
  inset: 12%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
}

.plant {
  position: absolute;
  top: 12%;
  left: 24%;
  width: 52%;
  height: 40%;
}

.stem {
  position: absolute;
  width: 7px;
  height: 150px;
  background: #55785a;
  left: 50%;
  bottom: 0;
  transform: translateX(-50%);
  border-radius: 10px;
}

.leaf {
  position: absolute;
  width: 85px;
  height: 45px;
  background: #5e875f;
  border-radius: 100% 0 100% 0;
}

.leaf.one {
  left: 4%;
  top: 35%;
  transform: rotate(-28deg);
}

.leaf.two {
  right: 0;
  top: 18%;
  transform: rotate(25deg) scaleX(-1);
}

.leaf.three {
  left: 2%;
  top: 2%;
  transform: rotate(-10deg);
}

.tablet {
  width: 62%;
  height: 32%;
  background: #303a31;
  border-radius: 16px;
  border: 7px solid #222822;
  position: relative;
  z-index: 2;
  box-shadow: 0 10px 20px rgba(0,0,0,.18);
}

.tablet-screen {
  position: absolute;
  inset: 8%;
  background: #eef3eb;
  border-radius: 6px;
  overflow: hidden;
}

.chart-line {
  position: absolute;
  left: 12%;
  right: 12%;
  bottom: 20%;
  height: 50%;
  border-bottom: 3px solid var(--green);
  transform: skewY(-25deg);
}

.chart-line::after {
  content: "";
  position: absolute;
  right: -1px;
  top: -1px;
  width: 0;
  height: 0;
  border-left: 9px solid var(--green);
  border-top: 5px solid transparent;
  border-bottom: 5px solid transparent;
}

.chart-bars {
  position: absolute;
  left: 14%;
  right: 14%;
  bottom: 10%;
  height: 18%;
  display: flex;
  align-items: end;
  gap: 8px;
}

.chart-bars span {
  flex: 1;
  background: var(--green);
  opacity: .75;
}

.chart-bars span:nth-child(1) { height: 35%; }
.chart-bars span:nth-child(2) { height: 55%; }
.chart-bars span:nth-child(3) { height: 42%; }
.chart-bars span:nth-child(4) { height: 75%; }
.chart-bars span:nth-child(5) { height: 100%; }

.coins {
  position: absolute;
  bottom: 9%;
  left: 13%;
  width: 30%;
  height: 18%;
}

.coin {
  position: absolute;
  width: 52px;
  height: 18px;
  background: var(--gold);
  border: 2px solid #ad8531;
  border-radius: 50%;
  box-shadow: 0 3px 0 #b78e37;
}

.coin:nth-child(1) {
  bottom: 0;
  left: 5%;
}

.coin:nth-child(2) {
  bottom: 14px;
  left: 20%;
}

.coin:nth-child(3) {
  bottom: 28px;
  left: 36%;
}

.coin:nth-child(4) {
  bottom: 14px;
  left: 48%;
}

.cover-copy {
  text-align: right;
  padding-right: 3%;
}

.star {
  font-size: 28px;
  margin-bottom: 15px;
  display: block;
}

.cover-title {
  font-family: "Playfair Display", Georgia, serif;
  font-size: clamp(48px, 7vw, 105px);
  line-height: .88;
  letter-spacing: .07em;
  font-weight: 600;
  margin: 0;
}

.cover-tagline {
  font-family: "Playfair Display", Georgia, serif;
  font-size: clamp(17px, 2.2vw, 31px);
  line-height: 1.15;
  letter-spacing: .22em;
  margin-top: 32px;
}

.cover-footer {
  text-align: center;
  font-family: "Playfair Display", Georgia, serif;
  font-size: clamp(13px, 1.2vw, 18px);
  padding: 22px;
}

/* ---------- NAV ---------- */

.nav {
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(200,208,192,.96);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(85,85,85,.3);
}

.nav-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  padding: 14px 0;
}

.logo {
  font-family: "Playfair Display", Georgia, serif;
  font-weight: 600;
  letter-spacing: .08em;
  font-size: 20px;
  white-space: nowrap;
}

.nav-links {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
  justify-content: flex-end;
}

.nav-links button {
  border: 0;
  background: transparent;
  padding: 7px 10px;
  border-radius: 999px;
  color: var(--charcoal);
  font-size: 12px;
}

.nav-links button:hover {
  background: rgba(255,255,255,.45);
}

/* ---------- GENERAL ---------- */

section {
  padding: 80px 0;
}

.section-head {
  margin-bottom: 35px;
}

.eyebrow {
  text-transform: uppercase;
  letter-spacing: .2em;
  font-size: 11px;
  color: var(--muted);
  font-weight: 700;
}

h2 {
  font-family: "Playfair Display", Georgia, serif;
  font-size: clamp(34px, 5vw, 58px);
  line-height: 1;
  margin: 8px 0 12px;
}

h3 {
  font-family: "Playfair Display", Georgia, serif;
  font-size: 25px;
  margin: 0 0 8px;
}

.section-head p {
  max-width: 680px;
  color: #4f544d;
}

.grid {
  display: grid;
  gap: 20px;
}

.grid-2 {
  grid-template-columns: repeat(2, minmax(0,1fr));
}

.grid-3 {
  grid-template-columns: repeat(3, minmax(0,1fr));
}

.card {
  background: rgba(242,239,233,.82);
  border: 1px solid rgba(28,28,28,.08);
  border-radius: var(--radius);
  padding: 25px;
  box-shadow: var(--shadow);
}

.soft-card {
  background: rgba(255,255,255,.48);
  border-radius: 18px;
  padding: 20px;
}

input,
select,
textarea {
  width: 100%;
  border: 1px solid rgba(28,28,28,.22);
  background: rgba(255,255,255,.75);
  color: var(--charcoal);
  padding: 12px 14px;
  border-radius: 12px;
  outline: none;
}

input:focus,
select:focus,
textarea:focus {
  border-color: var(--green);
  box-shadow: 0 0 0 3px rgba(46,158,91,.12);
}

label {
  display: block;
  font-size: 12px;
  font-weight: 700;
  margin-bottom: 7px;
}

.form-grid {
  display: grid;
  grid-template-columns: repeat(2,1fr);
  gap: 16px;
}

.btn {
  border: 0;
  background: var(--charcoal);
  color: white;
  padding: 12px 18px;
  border-radius: 999px;
  font-weight: 600;
  transition: transform .15s ease, opacity .15s ease;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
}

.btn:hover {
  transform: translateY(-1px);
  opacity: .92;
}

.btn-green {
  background: var(--green);
}

.btn-light {
  background: rgba(255,255,255,.7);
  color: var(--charcoal);
  border: 1px solid rgba(28,28,28,.12);
}

.btn-gold {
  background: var(--gold);
  color: var(--charcoal);
}

.btn-danger {
  background: var(--danger);
}

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 18px;
}

.result {
  margin-top: 20px;
  padding: 20px;
  background: rgba(200,208,192,.6);
  border-radius: 16px;
}

.big-number {
  font-family: "Playfair Display", Georgia, serif;
  font-size: 38px;
  font-weight: 600;
}

.muted {
  color: var(--muted);
  font-size: 13px;
}

.good {
  color: var(--green);
  font-weight: 700;
}

.warn {
  color: var(--danger);
  font-weight: 700;
}

.center {
  text-align: center;
}

hr.soft-rule {
  border: 0;
  border-top: 1px solid rgba(28,28,28,.1);
  margin: 25px 0;
}

/* ---------- HOME ---------- */

.hero-message {
  font-family: "Playfair Display", Georgia, serif;
  font-size: clamp(28px,4vw,48px);
  line-height: 1.1;
  max-width: 780px;
}

.feature-icon {
  font-size: 28px;
  margin-bottom: 8px;
}

.feature-card p {
  font-size: 14px;
  color: var(--muted);
}

/* ---------- GROCERY ---------- */

.grocery-row {
  display: grid;
  grid-template-columns: 1.5fr .6fr .8fr .8fr auto;
  gap: 8px;
  align-items: end;
}

.grocery-list {
  margin-top: 20px;
}

.grocery-item {
  display: grid;
  grid-template-columns: 1fr auto auto auto;
  gap: 10px;
  padding: 12px 0;
  border-bottom: 1px solid rgba(28,28,28,.1);
  align-items: center;
}

.grocery-item.purchased {
  opacity: .55;
  text-decoration: line-through;
}

/* ---------- CALCULATOR ---------- */

.calc-tabs {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.calc-tabs button {
  border: 1px solid rgba(28,28,28,.18);
  background: rgba(255,255,255,.5);
  padding: 9px 14px;
  border-radius: 999px;
}

.calc-tabs button.active {
  background: var(--charcoal);
  color: white;
}

.calc-panel {
  display: none;
}

.calc-panel.active {
  display: block;
}

/* ---------- GLOBAL CURRENCY CONVERTER ---------- */

.converter-card {
  background: rgba(242,239,233,.82);
  border: 1px solid rgba(28,28,28,.08);
  border-radius: var(--radius);
  padding: 25px;
  box-shadow: var(--shadow);
}

.converter-rate {
  margin-top: 15px;
  font-size: 13px;
  color: var(--muted);
}

.converter-status {
  margin-top: 12px;
  font-size: 13px;
  color: var(--muted);
}

.converter-status.loading {
  color: var(--charcoal);
  font-weight: 600;
}

.converter-status.error {
  color: var(--danger);
  font-weight: 700;
}

.converter-result {
  margin-top: 22px;
  padding: 22px;
  background: rgba(200,208,192,.6);
  border-radius: 18px;
}

.converter-result .conversion-line {
  font-size: 14px;
  color: var(--muted);
}

.converter-result .converted-value {
  font-family: "Playfair Display", Georgia, serif;
  font-size: clamp(32px,5vw,48px);
  font-weight: 600;
  line-height: 1.1;
  margin: 5px 0;
}

/* ---------- COPILOT ---------- */

.chat-box {
  background: rgba(255,255,255,.5);
  border-radius: 18px;
  padding: 18px;
  min-height: 180px;
}

.chat-answer {
  background: var(--offwhite);
  padding: 18px;
  border-radius: 16px;
  margin-bottom: 12px;
}

.chat-answer strong {
  font-family: "Playfair Display", Georgia, serif;
  font-size: 20px;
}

.quick-questions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 15px 0;
}

.quick-questions button {
  border: 1px solid rgba(28,28,28,.15);
  background: rgba(255,255,255,.6);
  border-radius: 999px;
  padding: 8px 12px;
  font-size: 12px;
}

/* ---------- WELLNESS ---------- */

.check-list label {
  font-weight: 500;
  margin-bottom: 12px;
  font-size: 14px;
}

.check-list input[type="checkbox"] {
  width: auto;
  margin-right: 8px;
}

/* ---------- HISTORY ---------- */

.history-item {
  border-left: 3px solid var(--green);
  padding: 14px 18px;
  background: rgba(255,255,255,.4);
  border-radius: 0 15px 15px 0;
  margin-bottom: 12px;
}

/* ---------- GROW ---------- */

.grow-card {
  text-align: center;
}

.grow-card .icon {
  font-size: 36px;
}

.disclosure {
  font-size: 11px;
  color: var(--muted);
  margin-top: 18px;
}

/* ---------- FOOTER ---------- */

footer {
  padding: 55px 0;
  border-top: 1px solid var(--line);
}

.footer-brand {
  font-family: "Playfair Display", Georgia, serif;
  font-size: 28px;
}

.footer-links {
  display: flex;
  flex-wrap: wrap;
  gap: 15px;
  margin: 20px 0;
  align-items: center;
}

.footer-links a {
  font-size: 13px;
  text-decoration: none;
}

.footer-links a:hover {
  text-decoration: underline;
}

.disclaimer {
  font-size: 11px;
  color: var(--muted);
  max-width: 800px;
}

/* ---------- TOAST ---------- */

.toast {
  position: fixed;
  right: 20px;
  bottom: 20px;
  z-index: 100;
  background: var(--charcoal);
  color: white;
  padding: 13px 18px;
  border-radius: 999px;
  transform: translateY(120px);
  opacity: 0;
  transition: .3s ease;
  font-size: 13px;
  max-width: calc(100% - 40px);
}

.toast.show {
  transform: translateY(0);
  opacity: 1;
}

/* ---------- PRINT ---------- */

@media print {
  body {
    background: white;
  }

  .cover,
  .nav,
  footer,
  .actions,
  .toast {
    display: none !important;
  }

  section {
    padding: 20px 0;
    page-break-inside: avoid;
  }

  .card,
  .converter-card {
    box-shadow: none;
    border: 1px solid #ccc;
    background: white;
  }

  .container {
    width: 100%;
  }

  h2 {
    font-size: 30px;
  }

  .result {
    background: #f5f5f5;
  }
}

/* ---------- RESPONSIVE ---------- */

@media (max-width: 850px) {
  .cover-inner {
    grid-template-columns: 1fr;
    text-align: center;
  }

  .cover-copy {
    text-align: center;
    padding: 0;
    order: -1;
  }

  .cover-title {
    font-size: clamp(50px, 14vw, 85px);
  }

  .cover-tagline {
    font-size: 16px;
  }

  .grid-3,
  .grid-2 {
    grid-template-columns: 1fr;
  }

  .nav-inner {
    flex-direction: column;
  }

  .nav-links {
    justify-content: center;
  }

  .grocery-row {
    grid-template-columns: 1fr 1fr;
  }
}

@media (max-width: 560px) {
  section {
    padding: 60px 0;
  }

  .container {
    width: min(100% - 22px, 1180px);
  }

  .form-grid {
    grid-template-columns: 1fr;
  }

  .grocery-row {
    grid-template-columns: 1fr;
  }

  .grocery-item {
    grid-template-columns: 1fr auto;
  }

  .grocery-item > div:nth-child(2) {
    grid-column: 1 / -1;
  }

  .cover {
    min-height: auto;
  }

  .cover-inner {
    padding-top: 45px;
  }

  .oval {
    width: 75%;
  }

  .nav-links button {
    font-size: 11px;
    padding: 6px 8px;
  }

  .actions .btn {
    width: 100%;
  }

  .quick-questions button {
    width: 100%;
    text-align: left;
  }

  #copilotQuestion {
    min-width: 0;
  }
}
</style>
</head>
